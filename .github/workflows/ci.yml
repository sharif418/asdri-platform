# CI — lint, typecheck, test, build on every push and pull request.
#
# The test suite provisions its own throwaway database: tests/preload.ts
# connects to the service's `postgres` admin database, drops + recreates
# `asdri_test` and applies the committed migrations BEFORE any test module
# imports @/lib/db, so the dev-style DATABASE_URL below never points the
# suite at anything but the throwaway DB.
#
# The build step runs `next build` with NODE_ENV=production, which makes
# src/lib/env.ts refuse to boot without real-format secrets — hence the
# hex values below (CI-only, no real secrets).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asdri
          POSTGRES_PASSWORD: asdri
          POSTGRES_DB: asdri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asdri -d asdri_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://asdri:asdri@localhost:5432/asdri_test
      # Both secrets are exactly 64 hex chars — src/lib/env.ts refuses shorter
      # values at production boot (the smoke step boots the real server).
      SESSION_SECRET: c14d0e2f6a8b4c9d3e5f7a1b6c8d0e2f4a6b8c9d0e2f4a6b8c9d0e2f4a6b8c9d
      PAYMENT_CALLBACK_SECRET: a7f1c9b3e5d2a4c6b8e0f2d4a6c8b0e2f4a6c8d0e2f4a6b8c9d0e2f4a6b8c9d0
      MAIL_DRIVER: log
      PAYMENT_PROVIDER: sandbox
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test (isolated asdri_test database)
        run: bun run test

      - name: Prisma client
        run: bunx prisma generate

      - name: Seed (content + CI admin, so static generation sees real data)
        run: bun scripts/seed.ts
        env:
          SEED_ADMIN_EMAIL: ci-admin@assunnah-institute.org
          SEED_ADMIN_PASSWORD: ci-only-admin-password-2026

      - name: Build
        run: bunx next build

      # ————— The 431 class of failure —————
      # A green build proves nothing about serving. This step boots the REAL
      # production server against the migrated+seeded database and requests the
      # four routes the proxy-loop regression took down (/, /en, /notices,
      # /admin). A rewrite loop / 5xx / non-response fails the pipeline here,
      # not on the client's VPS after deploy.
      - name: Smoke — boot production server, request real routes
        env:
          # The production server refuses PAYMENT_PROVIDER=sandbox at boot
          # (PR #16) — the smoke test runs the REAL production rules, so it
          # boots with the manual provider like a real deployment would.
          PAYMENT_PROVIDER: manual
          # CI has no S3/MinIO: acknowledge local-disk explicitly (dev-only escape hatch).
          STORAGE_LOCAL_OK: "1"
        run: |
          set -euo pipefail
          bunx next start -p 3100 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          # readiness (max ~60s)
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:3100/ || true)
            if [ "$code" != "000" ] && [ "$code" != "" ]; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = "1" ] || { echo "server never became ready"; cat server.log; exit 1; }
          fail=0
          for path in / /en /notices /academics/courses; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 http://127.0.0.1:3100"$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          # /admin unauthenticated redirects to the login gate — follow it.
          admin=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -L http://127.0.0.1:3100/admin)
          echo "/admin (login redirect followed) -> $admin"
          [ "$admin" = "200" ] || fail=1
          # sitemap + robots render on request (DB-free build contract)
          for path in /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 http://127.0.0.1:3100"$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" != "0" ]; then
            echo "SMOKE FAILED — production server responded wrong on a core route"
            cat server.log
            exit 1
          fi
          echo "Smoke OK — production server serves all core routes"
